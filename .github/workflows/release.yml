name: Release and Deploy

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+-release'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode - test workflow without publishing'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 验证标签版本与代码版本一致
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches code version
        id: check
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_VERSION=${GITHUB_REF#refs/tags/}
            TAG_VERSION=${TAG_VERSION%-release}
          else
            TAG_VERSION=""
          fi
          CODE_VERSION=$(grep -oP 'version\s*=\s*"\K[^"]+' pyproject.toml)

          echo "Tag version: $TAG_VERSION"
          echo "Code version: $CODE_VERSION"

          if [[ -n "$TAG_VERSION" && "$TAG_VERSION" != "$CODE_VERSION" ]]; then
            echo "❌ Version mismatch!"
            echo "Tag: $TAG_VERSION, Code: $CODE_VERSION"
            exit 1
          fi

          echo "✅ Version check passed: $CODE_VERSION"
          echo "version=$CODE_VERSION" >> $GITHUB_OUTPUT

  # 运行测试套件
  test:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Create venv and install dependencies
        run: |
          uv venv
          uv pip install pillow charset-normalizer setuptools

      - name: Generate required files
        run: uv run --no-project python setup.py egg_info

      - name: Run tests
        run: |
          echo "::group::Test Results"
          uv run --no-project python setup.py tests-preinstall
          echo "::endgroup::"
          echo "::notice::✅ All tests passed! Ready for release."

  # 构建和发布 (正式发布)
  build-and-publish:
    needs: [check-version, test]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.dry_run != 'true' }}
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: pip install build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          generate_release_notes: true
          files: dist/*

  # 构建和部署 GitHub Pages 文档
  deploy-docs:
    needs: [check-version, test]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.dry_run != 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Create venv and install dependencies
        run: |
          cd docs/userguide_web
          uv venv
          uv sync
          uv pip install -e ../../

      - name: Generate markdown from Python DSL
        run: |
          cd docs/userguide_web
          uv run python py2md.py
          uv run python py2md.py --zh-CN

      - name: Build MkDocs site
        run: |
          cd docs/userguide_web
          uv run python build.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/userguide_web/site

  # 部署 GitHub Pages
  deploy-pages:
    needs: deploy-docs
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.dry_run != 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 构建 (Dry Run 模式)
  build-dry-run:
    needs: [check-version, test]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.dry_run == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: pip install build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Dry run complete
        run: |
          echo "🏃 Dry run mode - build completed"
          echo "Wheel and sdist files are available as artifacts"
